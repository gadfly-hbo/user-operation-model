<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人群运营工作台 · UI Demo</title>
<style>
/* ── Token ─────────────────────────────────────────────────── */
:root {
  --font-sans: Inter, "DM Sans", "PingFang SC", "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --w-regular: 400; --w-medium: 500; --w-semibold: 600; --w-bold: 700;

  --text-xs: 12px; --text-sm: 14px; --text-base: 16px;
  --text-md: 18px; --text-lg: 20px; --text-xl: 24px; --text-2xl: 30px;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px;

  --radius-sm: 6px; --radius-md: 8px; --radius-pill: 999px;

  --header-height: 48px;
  --sidebar-width: 208px;

  --bg-canvas: hsl(220 23% 98%);
  --bg-subtle: hsl(220 18% 96%);
  --bg-surface: hsl(0 0% 100%);
  --bg-inset: hsl(220 18% 94%);
  --bg-hover: hsl(220 20% 95%);

  --border-subtle: hsl(220 16% 90%);
  --border-strong: hsl(220 14% 82%);

  --text-primary: hsl(224 28% 14%);
  --text-secondary: hsl(220 12% 37%);
  --text-tertiary: hsl(220 10% 50%);

  --accent-50: hsl(230 100% 98%);
  --accent-100: hsl(228 100% 96%);
  --accent-200: hsl(228 96% 90%);
  --accent-600: hsl(233 74% 57%);
  --accent-700: hsl(235 69% 50%);

  --success-50: hsl(145 64% 96%); --success-500: hsl(142 71% 45%); --success-700: hsl(142 72% 32%);
  --warning-50: hsl(48 100% 96%); --warning-500: hsl(38 92% 50%); --warning-700: hsl(32 95% 41%);
  --danger-50: hsl(0 86% 97%);  --danger-500: hsl(0 84% 60%);  --danger-700: hsl(0 72% 48%);
  --info-50: hsl(199 100% 96%); --info-500: hsl(199 89% 48%);  --info-700: hsl(201 96% 38%);

  --focus-ring: hsla(231, 85%, 63%, 0.35);
  --shadow-soft: 0 1px 2px hsla(224, 30%, 10%, 0.06), 0 8px 20px hsla(224, 30%, 10%, 0.04);
  --shadow-medium: 0 2px 6px hsla(224, 30%, 10%, 0.08), 0 12px 28px hsla(224, 30%, 10%, 0.06);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg-canvas: hsl(225 24% 10%);
  --bg-subtle: hsl(224 20% 12%);
  --bg-surface: hsl(223 18% 15%);
  --bg-inset: hsl(224 22% 8%);
  --bg-hover: hsl(223 18% 19%);
  --border-subtle: hsl(222 15% 24%);
  --border-strong: hsl(220 12% 32%);
  --text-primary: hsl(220 20% 96%);
  --text-secondary: hsl(218 12% 70%);
  --text-tertiary: hsl(218 10% 56%);
  --accent-50: hsl(233 40% 16%); --accent-100: hsl(233 38% 20%); --accent-200: hsl(233 36% 26%);
  --accent-600: hsl(231 70% 66%); --accent-700: hsl(230 74% 74%);
  --success-50: hsl(145 40% 14%); --success-500: hsl(142 62% 52%); --success-700: hsl(142 60% 66%);
  --warning-50: hsl(48 40% 14%); --warning-500: hsl(38 80% 58%); --warning-700: hsl(38 78% 70%);
  --danger-50: hsl(0 40% 16%);  --danger-500: hsl(0 72% 62%);  --danger-700: hsl(0 70% 74%);
  --info-50: hsl(199 40% 15%); --info-500: hsl(199 76% 56%);  --info-700: hsl(199 80% 70%);
  --focus-ring: hsla(231, 85%, 70%, 0.4);
  --shadow-soft: 0 1px 2px hsla(0, 0%, 0%, 0.3), 0 8px 20px hsla(0, 0%, 0%, 0.2);
  --shadow-medium: 0 2px 6px hsla(0, 0%, 0%, 0.35), 0 12px 28px hsla(0, 0%, 0%, 0.3);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-canvas);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-600); outline-offset: 2px; border-radius: var(--radius-sm); }

/* ── Shell ─────────────────────────────────────────────────── */
.shell { display: grid; grid-template-rows: var(--header-height) 1fr; height: 100vh; }

.header {
  display: flex; align-items: center; gap: var(--space-4);
  padding: 0 var(--space-4);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
}
.brand { display: flex; align-items: baseline; gap: var(--space-2); }
.brand__name { font-weight: var(--w-semibold); font-size: var(--text-base); letter-spacing: -0.01em; }
.brand__sub { font-size: var(--text-xs); color: var(--text-tertiary); }

.global-search {
  flex: 1; max-width: 420px; position: relative;
}
.global-search input {
  width: 100%; height: 30px; padding: 0 var(--space-3) 0 30px;
  background: var(--bg-canvas); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); font-size: var(--text-sm);
}
.global-search::before {
  content: "⌕"; position: absolute; left: 9px; top: 50%; transform: translateY(-54%);
  color: var(--text-tertiary); font-size: 15px;
}
.header__spacer { flex: 1; }
.header__meta { display: flex; align-items: center; gap: var(--space-3); }

.readiness {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px var(--space-2); border-radius: var(--radius-pill);
  background: var(--warning-50); color: var(--warning-700);
  font-size: var(--text-xs); font-weight: var(--w-medium);
}
.readiness__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning-500); }

.icon-btn {
  height: 28px; min-width: 28px; padding: 0 var(--space-2);
  background: transparent; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs);
  color: var(--text-secondary);
}
.icon-btn:hover { background: var(--bg-hover); }

.body { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 0; }

.sidebar {
  background: var(--bg-surface); border-right: 1px solid var(--border-subtle);
  padding: var(--space-3) var(--space-2); overflow-y: auto;
}
.nav-group + .nav-group { margin-top: var(--space-4); }
.nav-group__label {
  padding: 0 var(--space-2) var(--space-2);
  font-size: var(--text-xs); font-weight: var(--w-semibold);
  color: var(--text-tertiary); letter-spacing: 0.06em;
}
.nav-item {
  display: flex; align-items: center; gap: var(--space-2);
  width: 100%; padding: 6px var(--space-2); margin-bottom: 2px;
  background: transparent; border: 0; border-radius: var(--radius-sm);
  text-align: left; cursor: pointer; color: var(--text-secondary);
  font-size: var(--text-sm);
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item[aria-current="page"] {
  background: var(--accent-50); color: var(--accent-700); font-weight: var(--w-medium);
}
.nav-item__badge {
  margin-left: auto; font-size: var(--text-xs); color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
.nav-item__badge--warn { color: var(--warning-700); }

.main { overflow: auto; padding: var(--space-5) var(--space-6) var(--space-8); min-width: 0; }
.page { display: none; }
.page.is-active { display: block; }

/* ── 页面骨架 ─────────────────────────────────────────────── */
.context-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--space-4); margin-bottom: var(--space-4);
}
.page-title { font-size: var(--text-xl); font-weight: var(--w-semibold); letter-spacing: -0.015em; margin: 0 0 2px; }
.page-desc { color: var(--text-secondary); font-size: var(--text-sm); margin: 0; }
.context-actions { display: flex; gap: var(--space-2); align-items: center; }

/* 状态摘要：核心指标突出 */
.summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: var(--border-subtle);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  overflow: hidden; margin-bottom: var(--space-4);
}
.summary__cell { background: var(--bg-surface); padding: var(--space-3) var(--space-4); }
.summary__label { font-size: var(--text-xs); color: var(--text-tertiary); margin-bottom: 2px; }
.summary__value {
  font-size: var(--text-2xl); font-weight: var(--w-semibold); line-height: 1.1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.summary__note { font-size: var(--text-xs); color: var(--text-tertiary); margin-top: 2px; }
.summary__cell--accent .summary__value { color: var(--accent-700); }
.summary__cell--success .summary__value { color: var(--success-700); }
.summary__cell--warning .summary__value { color: var(--warning-700); }
.summary__cell--danger .summary__value { color: var(--danger-700); }

/* 工具栏 */
.toolbar {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3);
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
}
.toolbar__spacer { flex: 1; }
.toolbar__label { font-size: var(--text-xs); color: var(--text-tertiary); }

select.input, input.input {
  height: 30px; padding: 0 var(--space-2);
  background: var(--bg-canvas); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); font-size: var(--text-sm);
}
.input--sm { height: 26px; font-size: var(--text-xs); }

.btn {
  height: 30px; padding: 0 var(--space-3);
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-sm);
  color: var(--text-primary); font-weight: var(--w-medium);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--bg-hover); }
.btn--primary { background: var(--accent-600); border-color: var(--accent-600); color: #fff; }
.btn--primary:hover { background: var(--accent-700); border-color: var(--accent-700); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
.btn--ghost:hover { background: var(--bg-hover); }
.btn--sm { height: 26px; padding: 0 var(--space-2); font-size: var(--text-xs); }

/* 分段控件 */
.segmented { display: inline-flex; padding: 2px; gap: 2px; background: var(--bg-inset); border-radius: var(--radius-sm); }
.segmented button {
  height: 24px; padding: 0 var(--space-3); border: 0; border-radius: 4px;
  background: transparent; cursor: pointer; font-size: var(--text-xs);
  color: var(--text-secondary); font-weight: var(--w-medium);
}
.segmented button[aria-pressed="true"] {
  background: var(--bg-surface); color: var(--text-primary);
  box-shadow: 0 1px 2px hsla(224, 30%, 10%, 0.08);
}

/* ── 表格 ─────────────────────────────────────────────────── */
.table-wrap { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  position: sticky; top: 0; z-index: 1;
  text-align: left; font-weight: var(--w-semibold); color: var(--text-secondary);
  background: var(--bg-subtle); padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle); white-space: nowrap;
}
table.data td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover td { background: var(--bg-hover); }
table.data tbody tr.is-selected td { background: var(--accent-50); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--text-tertiary); }
.nowrap { white-space: nowrap; }

/* 徽标 */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px var(--space-2); border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: var(--w-medium); white-space: nowrap;
}
.badge--neutral { background: var(--bg-inset); color: var(--text-secondary); }
.badge--success { background: var(--success-50); color: var(--success-700); }
.badge--warning { background: var(--warning-50); color: var(--warning-700); }
.badge--danger  { background: var(--danger-50);  color: var(--danger-700); }
.badge--info    { background: var(--info-50);    color: var(--info-700); }
.badge--accent  { background: var(--accent-50);  color: var(--accent-700); }

/* ── 三栏工作区 ───────────────────────────────────────────── */
.lanes { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: var(--space-3); align-items: start; }
@media (max-width: 1180px) { .lanes { grid-template-columns: 1fr; } }

.lane { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; }
.lane__head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
}
.lane__title { font-size: var(--text-sm); font-weight: var(--w-semibold); }
.lane__step {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent-600); color: #fff; font-size: 11px; font-weight: var(--w-semibold);
}
.lane__body { padding: var(--space-3); }
.lane__body--flush { padding: 0; }

.field { margin-bottom: var(--space-3); }
.field:last-child { margin-bottom: 0; }
.field__label { display: block; font-size: var(--text-xs); color: var(--text-secondary); margin-bottom: 4px; font-weight: var(--w-medium); }
.field__input {
  width: 100%; min-height: 30px; padding: 5px var(--space-2);
  background: var(--bg-canvas); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); font-size: var(--text-sm);
}

/* 画像条：占比条 */
.barlist { display: flex; flex-direction: column; gap: 5px; }
.barlist__row { display: grid; grid-template-columns: 78px 1fr 46px; align-items: center; gap: var(--space-2); font-size: 12px; }
.barlist__label { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barlist__track { height: 6px; background: var(--bg-inset); border-radius: 3px; overflow: hidden; }
.barlist__fill { height: 100%; background: var(--accent-600); border-radius: 3px; }
.barlist__fill--peer { background: var(--info-500); }
.barlist__val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

/* 差异行：维度 + 左右两侧取值 + 下方强度条，文字不与图形重叠 */
.diffrow { padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
.diffrow:last-child { border-bottom: 0; }
.diffrow__head { display: grid; grid-template-columns: 72px 1fr auto 1fr; gap: var(--space-2); align-items: baseline; }
.diffrow__dim { font-size: 12px; color: var(--text-secondary); }
.diffrow__val { font-size: 12px; font-variant-numeric: tabular-nums; }
.diffrow__val--manual { text-align: right; color: var(--text-primary); }
.diffrow__val--algo { color: var(--text-primary); }
.diffrow__arrow { font-size: 11px; color: var(--text-tertiary); }
.diffrow__delta { font-size: 11px; color: var(--text-tertiary); margin-left: 6px; }
.diffbar { position: relative; height: 4px; margin-top: 4px; background: var(--bg-inset); border-radius: 2px; overflow: hidden; }
.diffbar__fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; }
.diffbar__fill--high { background: var(--success-500); }
.diffbar__fill--mid { background: var(--warning-500); }
.diffbar__fill--low { background: var(--danger-500); }

/* 决策选项卡 */
.decision {
  display: flex; gap: var(--space-2); padding: var(--space-2);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  margin-bottom: var(--space-2); cursor: pointer; background: var(--bg-surface);
}
.decision:hover { background: var(--bg-hover); }
.decision.is-active { border-color: var(--accent-600); background: var(--accent-50); }
.decision__mark { width: 16px; height: 16px; border-radius: 50%; flex: none; margin-top: 2px; border: 2px solid var(--border-strong); }
.decision.is-active .decision__mark { border-color: var(--accent-600); background: var(--accent-600); box-shadow: inset 0 0 0 2px var(--accent-50); }
.decision__body { min-width: 0; }
.decision__title { font-size: 13px; font-weight: var(--w-semibold); margin-bottom: 2px; }
.decision__desc { font-size: 12px; color: var(--text-secondary); }

/* 热力图 */
.heat { border-collapse: separate; border-spacing: 2px; font-size: 11px; }
.heat th { padding: var(--space-1); font-weight: var(--w-medium); color: var(--text-secondary); white-space: nowrap; font-size: 11px; }
.heat th.heat__corner { text-align: right; }
.heat__cell {
  width: 34px; height: 26px; text-align: center; border-radius: 3px;
  cursor: pointer; color: var(--text-primary); font-variant-numeric: tabular-nums;
}
.heat__cell:hover { outline: 2px solid var(--accent-600); outline-offset: -2px; }
.heat__label { font-size: 11px; color: var(--text-secondary); white-space: nowrap; padding-right: 6px; }

/* 抽屉 */
.drawer-backdrop {
  position: fixed; inset: 0; background: hsla(224, 30%, 10%, 0.32);
  display: none; z-index: 40;
}
.drawer-backdrop.is-open { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 92vw;
  background: var(--bg-surface); border-left: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-medium); transform: translateX(100%);
  transition: transform .18s ease; z-index: 41; display: flex; flex-direction: column;
}
.drawer.is-open { transform: translateX(0); }
.drawer__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle);
}
.drawer__title { font-weight: var(--w-semibold); font-size: var(--text-base); }
.drawer__body { padding: var(--space-4); overflow-y: auto; flex: 1; }
.drawer__foot { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-subtle); display: flex; gap: var(--space-2); justify-content: flex-end; }

/* 技术细节折叠 */
details.tech { margin-top: var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); background: var(--bg-surface); }
details.tech > summary {
  padding: var(--space-2) var(--space-3); cursor: pointer; font-size: var(--text-xs);
  color: var(--text-secondary); font-weight: var(--w-medium); list-style: none;
}
details.tech > summary::-webkit-details-marker { display: none; }
details.tech > summary::before { content: "▸ "; color: var(--text-tertiary); }
details.tech[open] > summary::before { content: "▾ "; }
details.tech .tech__body { padding: 0 var(--space-3) var(--space-3); font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); white-space: pre-wrap; }

/* 诊断 */
.diag { display: flex; gap: var(--space-3); padding: var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface); margin-bottom: var(--space-2); }
.diag__flag { width: 3px; border-radius: 2px; flex: none; }
.diag__flag--ok { background: var(--success-500); }
.diag__flag--warn { background: var(--warning-500); }
.diag__flag--bad { background: var(--danger-500); }
.diag__body { min-width: 0; }
.diag__title { font-weight: var(--w-semibold); font-size: 13px; margin-bottom: 2px; }
.diag__desc { font-size: 12px; color: var(--text-secondary); }

/* 空状态 */
.empty { padding: var(--space-8) var(--space-4); text-align: center; color: var(--text-tertiary); }
.empty__title { font-weight: var(--w-medium); color: var(--text-secondary); margin-bottom: 4px; font-size: var(--text-sm); }

/* Cohort 热力图 */
.cohort td.heat__cell { width: 42px; }

/* 布局辅助 */
.stack { display: flex; flex-direction: column; gap: var(--space-3); }
.row { display: flex; align-items: center; gap: var(--space-2); }
.mt-2 { margin-top: var(--space-2); } .mt-3 { margin-top: var(--space-3); } .mt-4 { margin-top: var(--space-4); }
.mb-2 { margin-bottom: var(--space-2); } .mb-3 { margin-bottom: var(--space-3); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-3); }
.section-title { font-size: var(--text-base); font-weight: var(--w-semibold); margin: 0 0 var(--space-2); letter-spacing: -0.01em; }
.hint { font-size: var(--text-xs); color: var(--text-tertiary); }
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="brand">
      <span class="brand__name">人群运营工作台</span>
      <span class="brand__sub">人-货-渠联动</span>
    </div>
    <div class="global-search">
      <input type="search" placeholder="搜索款号、渠道、标签…" aria-label="全局搜索" />
    </div>
    <div class="header__spacer"></div>
    <div class="header__meta">
      <span class="readiness" title="8 个工具的数据源尚未接入">
        <span class="readiness__dot"></span>数据就绪 9 / 17
