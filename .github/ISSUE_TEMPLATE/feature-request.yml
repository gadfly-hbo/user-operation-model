name: 需求与想法
description: 提出本项目的新需求、口径调整或产品改进方向。
title: "[需求] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请先阅读[产品讨论稿](/docs/产品讨论稿-v0.1.md)与[工程规范](/docs/engineering-workflow.md)。
        **不要在 Issue 中粘贴业务数据**：原始导出、画像表、报表产物一律留在本机，本 Issue 只描述需求与可公开的脱敏示例。
  - type: textarea
    id: goal
    attributes:
      label: 目标与业务问题
      description: 这个需求要解决什么业务问题？涉及人、货、渠哪一侧？当前是怎么做的，期望变成什么样？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与不做事项
      description: 明确本次要做什么、不做什么。说明受影响的需求条目（需求一／二／三）或阶段（P0–P4）。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用外部可观察的结果描述，例如"给定某渠道与某商品，输出匹配分与差异点"。不要写实现步骤。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 约束、依赖的业务数据条件、需要用户拍板的口径问题等。未知项如实标注，不要填猜测值。
